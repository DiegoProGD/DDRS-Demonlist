<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Demonlist Page</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: #F5F5F5; /* light gray */
      color: #1A1A1A; /* dark text */
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background: #FFFFFF;
      padding: 25px;
      text-align: center;
      border-bottom: 3px solid #3B82F6; /* strong blue */
    }

    header h1 {
      margin: 0;
      font-size: 2.4rem;
      color: #1A1A1A;
      font-weight: 700;
    }

    main {
      max-width: 1000px;
      margin: 35px auto;
      padding: 0 20px 50px;
      display: flex;
      gap: 25px;
    }

    .left { flex: 2; }
    .right { flex: 1; }

    .section {
      background: #FFFFFF;
      border: 2px solid #3B82F6; /* blue border */
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.05);
    }

    .title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2563EB; /* deeper blue */
      margin-bottom: 10px;
    }

    .property {
      margin: 10px 0;
      font-size: 1.2rem;
      color: #4B5563;
    }

    .property span {
      font-weight: 700;
      color: #1A1A1A;
    }

    .quote {
      font-style: italic;
      color: #2563EB;
      margin-top: 10px;
    }

    .level-image {
      width: 100%;
      border-radius: 10px;
      border: 3px solid #3B82F6;
      margin-top: 10px;
    }

    a {
      color: #3B82F6;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      color: #2563EB;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<header>
  <h1>Society</h1>
</header>

<main>

  <!-- LEFT SIDE -->
  <div class="left">

    <!-- PREVIEW IMAGE -->
    <section class="section">
      <div class="title">Preview</div>
      <img src="society.png" class="level-image" alt="Level Preview">
    </section>

    <!-- INFO -->
    <section class="section">
      <div class="title">Info</div>

      <div class="property"><span>Creator:</span> Apex0727</div>
      <div class="property"><span>Published By:</span> Apex0727</div>
      <div class="property"><span>Verifier:</span> ColDeez</div>

      <div class="quote">"Society By Neomarbilan, Verified By WPopoff"</div>
    </section>

    <!-- BACK BUTTON -->
    <section class="section">
      <a href="index.html">← Back to The DRDS Demonlist</a>
    </section>

  </div>

  <!-- RIGHT SIDE -->
  <div class="right">

    <!-- LIST EDITORS -->
    <section class="section">
      <div class="title">List Editors</div>
      <div class="property">DiegoProGD</div>
      <div class="property">MoseCoder</div>
    </section>

    <!-- LIST HELPERS -->
    <section class="section">
      <div class="title">List Helpers</div>
      <div class="property">No List Helpers Yet! Come Back Later To See If There Are!</div>
    </section>

  </div>

</main>

</body>
</html>
